<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Detoxer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f8;
            color: #222;
        }
        header {
            background: #111;
            color: #fff;
            padding: 24px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
        }
        header p {
            margin: 8px 0 0;
            color: #ccc;
        }
        .container {
            max-width: 960px;
            margin: 32px auto;
            padding: 0 20px;
        }
        .contact-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: 1fr 1fr;
        }
        .contact-card, .contact-form {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 28px;
        }
        .contact-card h2, .contact-form h2 {
            margin-top: 0;
        }
        .contact-info p {
            margin: 14px 0;
            line-height: 1.6;
        }
        .contact-info strong {
            display: inline-block;
            width: 100px;
        }
        .contact-form form {
            display: grid;
            gap: 16px;
        }
        .contact-form label {
            font-weight: 600;
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .contact-form textarea {
            min-height: 160px;
            resize: vertical;
        }
        .contact-form button {
            border: none;
            background: #111;
            color: #fff;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .contact-form button:hover {
            background: #333;
        }
        @media (max-width: 760px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
</head>
<body>
    <header>
        <h1>Contact Detoxer</h1>
        <p>Have questions about our cameras, lenses, or support? We're here to help.</p>
    </header>

    <main class="container">
        <div class="contact-grid">
            <section class="contact-card">
                <h2>Get in Touch</h2>
                <div class="contact-info">
                    <p><strong>Email:</strong> support@camerapro.com</p>
                    <p><strong>Phone:</strong> +1 (555) 123-4567</p>
                    <p><strong>Address:</strong> 320 Lens Avenue, Cityville, CA 90210</p>
                    <p><strong>Hours:</strong> Mon-Fri 9am - 6pm</p>
                </div>
                <h2>Follow Us</h2>
                <div class="logoo">
                <p > <a href="#"><i class="fa-brands fa-facebook"></i></i></a>: @CameraPro</p>
                <p  ><a href="#"><i class="fa-brands fa-instagram"></i></i></a>: @CameraProStore</p></div>
            </section>

            <section class="contact-form">
                <h2>Send Us a Message</h2>
                <form action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required />

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Order inquiry, support, etc." />

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Tell us how we can help" required></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
